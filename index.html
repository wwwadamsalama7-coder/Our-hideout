<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفتنا الخاصة</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }
        .chat-header {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafbfc;
        }
        .message {
            background: #e9ecef;
            color: #333;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
            align-self: flex-start;
        }
        .message.mine {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #fff;
            border-top: 1px solid #eee;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">غرفتنا الخاصة</div>
        
        <div class="chat-messages" id="messagesList">
            <div class="message">مرحباً بك، ابدأ المحادثة الآن</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا...">
            <button id="sendBtn" type="button">إرسال</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('messageInput');
        const btn = document.getElementById('sendBtn');
        const list = document.getElementById('messagesList');

        function loadMessages() {
            const msgs = JSON.parse(localStorage.getItem('room_chat')) || [];
            list.innerHTML = '';
            if (msgs.length === 0) {
                const div = document.createElement('div');
                div.className = 'message';
                div.textContent = 'مرحباً بك، ابدأ المحادثة الآن';
                list.appendChild(div);
                return;
            }
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = 'message ' + (m.sender === 'user' ? 'mine' : '');
                div.textContent = m.text;
                list.appendChild(div);
            });
            list.scrollTop = list.scrollHeight;
        }

        function sendMessage() {
            const text = input.value.trim();
            if (text !== "") {
                let msgs = JSON.parse(localStorage.getItem('room_chat')) || [];
                msgs.push({ sender: 'user', text: text });
                localStorage.setItem('room_chat', JSON.stringify(msgs));
                input.value = "";
                loadMessages();
            }
        }

        btn.onclick = sendMessage;
        input.onkeypress = function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        };

        loadMessages();
        setInterval(loadMessages, 1000);
    </script>

</body>
</html>
