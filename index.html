<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفتنا الخاصة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #eaeaea;
        }
        .chat-header {
            background-color: #ffffff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            height: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #fafbfc;
        }
        .message {
            background-color: #e9ecef;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
            color: #333;
        }
        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #fff;
            border-top: 1px solid #eee;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area input:focus {
            border-color: #007bff;
        }
        .chat-input-area button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .chat-input-area button:hover {
            background-color: #0056b3;
        }
        .call-btn-container {
            padding: 12px;
            background: #fff;
            text-align: center;
            border-top: 1px solid #eee;
        }
        .call-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
        }
        .call-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            💬 غرفتنا الخاصة
        </div>
        
        <div class="chat-messages" id="messagesList">
            <div class="message">أهلاً بيك: الموقع جاهز للتطوير ونربط الشات والكول قريباً.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا...">
            <button id="sendBtn">إرسال</button>
        </div>

        <div class="call-btn-container">
            <button class="call-btn" id="callBtn">📞 بدء مكالمة صوتية</button>
        </div>
    </div>

    <script>
        const messagesList = document.getElementById('messagesList');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.addEventListener('click', function() {
            const text = messageInput.value.trim();
            if (text !== "") {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', 'user');
                msgDiv.textContent = text;
                messagesList.appendChild(msgDiv);
                
                // مسح خانة الكتابة ونزول الشاشة لآخر رسالة تلقائياً
                messageInput.value = "";
                messagesList.scrollTop = messagesList.scrollHeight;
            }
        });

        // السماح بالإرسال عن طريق زر Enter لوحة المفاتيح
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });
    </script>

</body>
</html>
