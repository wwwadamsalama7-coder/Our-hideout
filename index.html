<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفتنا الخاصة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #eaeaea;
            height: 90vh;
        }
        .chat-header {
            background-color: #ffffff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #eee;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #fafbfc;
        }
        .message {
            background-color: #e9ecef;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
            color: #333;
        }
        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #fff;
            border-top: 1px solid #eee;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .status-bar {
            font-size: 11px;
            text-align: center;
            padding: 6px;
            background: #d4edda;
            color: #155724;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">💬 غرفتنا الخاصة</div>
        <div class="status-bar" id="status">متصل وجاهز للمراسلة الفورية</div>
        
        <div class="chat-messages" id="messagesList">
            <div class="message user">أهلاً بك في غرفتك الخاصة، ابدأ الكتابة الآن!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا...">
            <button id="sendBtn">إرسال</button>
        </div>
    </div>

    <script>
        const messagesList = document.getElementById('messagesList');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function loadMessages() {
            const savedMessages = JSON.parse(localStorage.getItem('our_hideout_chat')) || [];
            messagesList.innerHTML = '';
            
            if(savedMessages.length === 0) {
                const defaultDiv = document.createElement('div');
                defaultDiv.classList.add('message', 'user');
                defaultDiv.textContent = 'أهلاً بك في غرفتك الخاصة، ابدأ الكتابة الآن!';
                messagesList.appendChild(defaultDiv);
            } else {
                savedMessages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.classList.add('message', 'user');
                    msgDiv.textContent = msg;
                    messagesList.appendChild(msgDiv);
                });
            }
            messagesList.scrollTop = messagesList.scrollHeight;
        }

        sendBtn.addEventListener('click', function() {
            const text = messageInput.value.trim();
            if (text !== "") {
                const savedMessages = JSON.parse(localStorage.getItem('our_hideout_chat')) || [];
                savedMessages.push(text);
                localStorage.setItem('our_hideout_chat', JSON.stringify(savedMessages));
                
                messageInput.value = "";
                loadMessages();
            }
        });

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        loadMessages();
    </script>

</body>
</html>
