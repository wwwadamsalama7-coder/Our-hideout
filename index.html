<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعنا الخاص</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .chat-box { height: 300px; border: 1px solid #ddd; border-radius: 5px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; text-align: right; background: #fafafa; }
        input[type="text"] { width: 75%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 15px; background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #006dd9; }
        .call-section { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .call-btn { background: #28a745; }
        .call-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>غرفتنا الخاصة 💬</h2>
        
        <!-- قسم الشات -->
        <div class="chat-box" id="chatBox">
            <p><b>أهلاً بيك:</b> الموقع جاهز للتطوير ونربط الشات والكول قريب.</p>
        </div>
        
        <div>
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا...">
            <button onclick="sendMessage()">إرسال</button>
        </div>

        <!-- قسم الكول -->
        <div class="call-section">
            <button class="call-btn" onclick="startCall()">📞 بدء مكالمة صوتية</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            var input = document.getElementById('messageInput');
            var chatBox = document.getElementById('chatBox');
            if(input.value.trim() !== "") {
                chatBox.innerHTML += "<p><b>أنا:</b> " + input.value + "</p>";
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function startCall() {
            alert("قريباً هنفعل الكول المباشر بينكم هنا!");
        }
    </script>

</body>
</html>
